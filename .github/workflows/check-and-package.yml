name: Check and package portfolio
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck && npm test && npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: creative-storm-ready-to-host
          path: dist
          retention-days: 30
      - run: npm install --no-save playwright && npx playwright install --with-deps chromium
      - run: node tests/browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: creative-storm-browser-checks
          path: test-results
          retention-days: 30
